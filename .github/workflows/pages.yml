name: Pages

# Publishes README.md as the public documentation site at https://mcp.zip.tax/
# while the repository stays internal. Only README.md and LICENSE are copied
# into the site; nothing else in the repo is published.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble the site from README.md and LICENSE
        run: |
          mkdir site
          {
            printf -- '---\ntitle: Ziptax MCP Server\n---\n\n'
            cat README.md
          } > site/index.md
          {
            printf -- '---\ntitle: License\npermalink: /LICENSE/\n---\n\n```text\n'
            cat LICENSE
            printf -- '```\n'
          } > site/license.md
          cat > site/_config.yml <<'EOF'
          title: Ziptax MCP Server
          description: HTTP MCP server for real-time US and Canadian sales tax rates from the Ziptax API
          theme: jekyll-theme-primer
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
